name: Build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  plugin:
    name: EnVar / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toolchain: msvc, os: windows-latest, release: true, targets: "x86-ansi,x86-unicode,amd64-unicode,arm64-unicode" }
          - { toolchain: mingw, os: ubuntu-latest, release: false, targets: "x86-ansi,x86-unicode,amd64-unicode" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: nsis-dev/build-plugin@main
        with:
          name: EnVar
          toolchain: ${{ matrix.toolchain }}
          release: ${{ matrix.release }}
          sources: Contrib/EnVar/*.c
          targets: ${{ matrix.targets }}
